<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo 2</title>
    <!-- css style -->
    <style>
        /* container */
        .container {
            display: flex;
            background-color: #1e90ff;
            padding: 10px;
            /* blue background */
            gap: 10px;
            justify-content: center;
            justify-content: flex-end;
            justify-content: space-around;
            justify-content: space-between;
            justify-content: space-evenly;

            height: 200px;
            align-items: flex-end;
            align-items: flex-start;
            align-items: stretch;
            align-items: center;
        }

        /* column */
        .col {
            background-color: #f1f1f1;

            padding: 30px;
            font-size: 24px;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- html -->
    <header>
        <div class="container">
            <div class="col">1</div>
            <div class="col">2</div>
            <div class="col">3</div>
        </div>
    </header>
</body>

</html>
